<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2x2 CSS Grid</title>
<style>
    /* 
     * Holder Requirements:
     * 200px total size, CSS Grid, 2x2 layout using repeat()
     */
    .holder {
        display: grid;
        width: 200px;
        height: 200px;
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(2, 1fr);
    }

    /* 
     * Base styling for the items just to make the grid visible. 
     * Per instructions, no structural grid properties are added here.
     */
    .item {
        background-color: #007acc;
        border: 2px solid #ffffff;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        font-size: 24px;
    }
</style>
</head>
<body>

    <div class="holder">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
    </div>

</body>
</html>
